name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test -- test/integration.test.ts --run
        env:
          TRMNL_API_BASE_URL: ${{ secrets.TRMNL_API_BASE_URL || 'https://api.trmnl.com' }}
